<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f8f9fa">
<title>بازی نقش‌های دستوری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1a73e8; --blue-dark:#1558b0;
    --red:#d93025; --green:#1e8e3e;
    --grey:#5f6368; --bg:#f8f9fa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Vazirmatn',system-ui,sans-serif;
    background:var(--bg); color:#202124;
    -webkit-user-select:none;user-select:none;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* پس‌زمینه سبک */
  .bg-orbs{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(circle at 90% 5%, rgba(66,133,244,.18) 0%, transparent 40%),
      radial-gradient(circle at 5% 95%, rgba(234,67,53,.14) 0%, transparent 40%),
      radial-gradient(circle at 15% 40%, rgba(251,188,5,.12) 0%, transparent 35%),
      radial-gradient(circle at 90% 80%, rgba(52,168,83,.14) 0%, transparent 40%);
  }
  .wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:16px 12px 90px;}

  header.top{display:flex;align-items:center;gap:10px;padding:4px 4px 14px;}
  .logo{font-weight:900;font-size:20px;color:var(--blue);letter-spacing:-.5px;}
  .spacer{flex:1;}
  .progress-pill{
    border-radius:999px;padding:6px 12px;font-weight:700;
    font-size:12px;color:#3c4043;display:flex;align-items:center;gap:6px;
    background:#fff;box-shadow:0 1px 3px rgba(60,64,67,.18);
    transition:opacity .25s;
  }
  .progress-pill.hidden-pill{opacity:0;pointer-events:none;}
  .progress-pill b{color:var(--blue);font-size:14px;}

  /* کارت شیشه‌ای سبک — بدون backdrop-filter */
  .glass-card{
    position:relative;border-radius:20px;overflow:hidden;
    background:rgba(255,255,255,.72);
    border:1px solid rgba(255,255,255,.85);
    box-shadow:0 4px 18px rgba(60,64,67,.14);
  }
  .glass-content{position:relative;padding:20px 16px 22px;}

  .hint{text-align:center;color:var(--grey);font-size:12.5px;margin-bottom:12px;line-height:1.8;}

  .sentences{display:flex;flex-direction:column;gap:9px;}
  .sentence{
    background:rgba(255,255,255,.65);
    border:1px solid rgba(0,0,0,.04);
    border-radius:12px;padding:10px 8px;
    display:flex;flex-wrap:wrap;gap:0;align-items:center;justify-content:center;
    animation:pop .3s ease-out both;
    will-change:transform,opacity;
  }
  @keyframes pop{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .word{
    position:relative;padding:6px 9px;border-radius:9px;
    background:#fff;
    font-size:14px;font-weight:600;cursor:pointer;
    box-shadow:0 1px 2px rgba(60,64,67,.14);
    transition:transform .15s ease-out,background .15s,color .15s,box-shadow .15s;
    border:1.5px solid transparent;margin:2px 1px;line-height:1.5;
    -webkit-tap-highlight-color:transparent;
  }
  .word:active{transform:scale(.94);}
  .word.assigned{
    background:#e8f0fe;color:var(--blue-dark);border-color:#aecbfa;
  }
  .word.assigned::after{
    content:attr(data-label);position:absolute;top:-8px;left:50%;transform:translateX(-50%);
    background:var(--blue);color:#fff;font-size:9px;font-weight:700;
    padding:1px 6px;border-radius:999px;white-space:nowrap;
    box-shadow:0 1px 3px rgba(26,115,232,.35);
  }
  .word.correct{
    background:#e6f4ea!important;border-color:#81c995!important;color:#137333!important;
  }
  .word.correct::after{background:var(--green);}
  .word.wrong{
    background:#fce8e6!important;border-color:#f28b82!important;color:#c5221f!important;
  }
  .word.wrong::after{background:var(--red);}
  .word.wrong::before{
    content:"";position:absolute;left:6px;right:6px;bottom:3px;height:2px;
    background:var(--red);border-radius:3px;
  }
  .word.locked{cursor:default;}
  .word.locked:active{transform:none;}

  .actions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
  .btn{
    font-family:inherit;font-size:14.5px;font-weight:700;border:none;border-radius:999px;
    padding:12px 26px;cursor:pointer;
    transition:transform .15s ease-out,background .15s;
    display:inline-flex;align-items:center;gap:6px;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.95);}
  .btn-primary{background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(26,115,232,.35);}
  .btn-primary:disabled{background:#dadce0;color:#9aa0a6;cursor:not-allowed;box-shadow:none;}
  .btn-ghost{background:#fff;color:var(--blue);border:1.5px solid #dadce0;}

  .overlay{
    position:fixed;inset:0;background:rgba(32,33,36,.5);
    z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .overlay.on{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);
    width:min(560px,100%);
    background:#fff;
    border-radius:24px 24px 0 0;z-index:60;padding:8px 14px 20px;
    box-shadow:0 -4px 24px rgba(0,0,0,.2);
    transition:transform .3s ease-out;
    will-change:transform;
  }
  .sheet.on{transform:translate(-50%,0);}
  .sheet .handle{width:40px;height:4px;border-radius:5px;background:#dadce0;margin:4px auto 10px;}
  .sheet h3{margin:0 0 2px;text-align:center;font-size:16px;}
  .sheet .selected-word{text-align:center;color:var(--blue);font-weight:800;font-size:18px;margin:4px 0 12px;}
  .roles-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
  @media(min-width:520px){.roles-grid{grid-template-columns:repeat(4,1fr);}}
  .role-btn{
    font-family:inherit;font-size:13px;font-weight:700;padding:13px 6px;border-radius:12px;
    border:1.5px solid #dadce0;background:#fff;color:#3c4043;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s,transform .15s;
  }
  .role-btn:active{transform:scale(.95);}
  .role-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .role-btn.clear-role{grid-column:1/-1;color:var(--red);border-color:#f5c6c4;}

  /* پنجره خطا */
  .toast{
    position:fixed;top:50%;left:50%;
    transform:translate(-50%,-50%) scale(.9);
    opacity:0;pointer-events:none;
    background:#fff;border:2px solid var(--red);
    border-radius:16px;padding:22px 34px;z-index:100;
    box-shadow:0 8px 30px rgba(217,48,37,.25);
    display:flex;flex-direction:column;align-items:center;gap:14px;
    min-width:200px;
    transition:transform .28s ease-out,opacity .25s;
  }
  .toast.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;}
  .toast .toast-msg{
    font-size:18px;font-weight:800;color:var(--red);
    display:flex;align-items:center;gap:8px;
  }
  .toast .toast-msg .num{font-size:24px;color:#c5221f;}
  .toast .toast-ok{
    font-family:inherit;font-size:14px;font-weight:700;
    border:none;border-radius:999px;padding:9px 24px;cursor:pointer;
    background:var(--red);color:#fff;
  }

  /* پنجره تأیید */
  .confirm{
    position:fixed;top:50%;left:50%;
    transform:translate(-50%,-50%) scale(.9);
    opacity:0;pointer-events:none;
    background:#fff;border:2px solid var(--blue);
    border-radius:16px;padding:22px 28px;z-index:100;
    box-shadow:0 8px 30px rgba(26,115,232,.25);
    display:flex;flex-direction:column;align-items:center;gap:16px;
    min-width:240px;text-align:center;
    transition:transform .28s ease-out,opacity .25s;
  }
  .confirm.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;}
  .confirm .confirm-msg{font-size:16px;font-weight:800;color:#202124;line-height:1.8;}
  .confirm .confirm-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .confirm button{
    font-family:inherit;font-size:13.5px;font-weight:700;
    border:none;border-radius:999px;padding:10px 22px;cursor:pointer;
  }
  .confirm .yes{background:var(--blue);color:#fff;}
  .confirm .no{background:#f1f3f4;color:#3c4043;}

  .center-screen{text-align:center;padding:30px 18px;}
  .big-emoji{font-size:52px;display:block;margin-bottom:8px;}
  .center-screen h2{font-size:21px;margin:0 0 10px;}
  .center-screen p{color:var(--grey);line-height:1.9;margin:0 0 18px;font-size:14px;}

  /* کانفتی سبک */
  .confetti{position:fixed;top:-10px;width:8px;height:12px;z-index:99;pointer-events:none;border-radius:2px;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.85;}}

  .stats{display:flex;gap:10px;justify-content:center;margin:16px 0 4px;flex-wrap:wrap;}
  .stat{background:#f1f3f4;border-radius:14px;padding:10px 18px;min-width:90px;}
  .stat b{display:block;font-size:21px;color:var(--blue);}
  .stat span{font-size:12px;color:var(--grey);}

  .hidden{display:none!important;}

  /* اگر دستگاه ضعیف است، انیمیشن‌ها را کم کن */
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important;}
  }
</style>
</head>
<body>

<div class="bg-orbs"></div>

<div class="wrap">
  <header class="top">
    <div class="logo">فارسی</div>
    <div class="spacer"></div>
    <div class="progress-pill hidden-pill" id="progressPill">مرحله <b id="roundNum">۱</b> • <span id="perRoundLbl">۲ جمله</span></div>
  </header>

  <div id="startScreen" class="glass-card">
    <div class="glass-content center-screen">
      <span class="big-emoji">🎓</span>
      <h2>بازی نقش‌های دستوری</h2>
      <p>
        روی هر کلمه ضربه بزن و نقش دستوری‌اش را انتخاب کن:<br>
        <b>نهاد، مفعول، متمم، مسند، فعل، قید، منادا، حرف اضافه</b>
      </p>
      <div class="actions">
        <button class="btn btn-primary" id="startBtn">شروع بازی 🚀</button>
      </div>
    </div>
  </div>

  <div id="gameScreen" class="hidden">
    <div class="glass-card">
      <div class="glass-content">
        <div class="hint">روی کلمه بزن تا نقشش را انتخاب کنی</div>
        <div class="sentences" id="sentences"></div>
        <div class="actions">
          <button class="btn btn-primary" id="checkBtn" disabled>تایید ✓</button>
          <button class="btn btn-ghost" id="resetBtn">پاک کردن ↺</button>
        </div>
      </div>
    </div>
  </div>

  <div id="roundEndScreen" class="hidden">
    <div class="glass-card">
      <div class="glass-content center-screen">
        <span class="big-emoji" id="endEmoji">🎉</span>
        <h2 id="endTitle">آفرین!</h2>
        <p id="endText"></p>
        <div class="stats">
          <div class="stat"><b id="statCorrect">0</b><span>درست</span></div>
          <div class="stat"><b id="statWrong">0</b><span>اشتباه</span></div>
          <div class="stat"><b id="statRound">1</b><span>مرحله</span></div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="nextBtn">مرحله بعد ➜</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <h3>نقش دستوری این کلمه چیست؟</h3>
  <div class="selected-word" id="selectedWord">—</div>
  <div class="roles-grid" id="rolesGrid"></div>
</div>

<div class="toast" id="toast">
  <div class="toast-msg"><span class="num" id="toastNum">۰</span> اشتباه</div>
  <button class="toast-ok" id="toastOk">باشه</button>
</div>

<div class="confirm" id="confirm">
  <div class="confirm-msg">همه‌ی نقش‌ها پاک شوند؟</div>
  <div class="confirm-btns">
    <button class="yes" id="confirmYes">بله، پاک کن</button>
    <button class="no" id="confirmNo">انصراف</button>
  </div>
</div>

  {s:[{w:"پرندگان",r:"نهاد"},{w:"در",r:"حرف اضافه"},{w:"آسمان",r:"متمم"},{w:"پرواز",r:null},{w:"می‌کنند",r:"فعل"}]},

  {s:[{w:"مادر",r:"نهاد"},{w:"برای",r:"حرف اضافه"},{w:"من",r:"متمم"},{w:"غذا",r:"مفعول"},{w:"پخت",r:"فعل"}]},
  {s:[{w:"پدر",r:"نهاد"},{w:"دیروز",r:"قید"},{w:"روزنامه",r:"مفعول"},{w:"خواند",r:"فعل"}]},
  {s:[{w:"او",r:"نهاد"},{w:"خیلی",r:"قید"},{w:"سریع",r:"قید"},{w:"دوید",r:"فعل"}]},
  {s:[{w:"من",r:"نهاد"},{w:"از",r:"حرف اضافه"},{w:"او",r:"متمم"},{w:"پرسیدم",r:"فعل"}]},
  {s:[{w:"او",r:"نهاد"},{w:"به",r:"حرف اضافه"},{w:"من",r:"متمم"},{w:"کمک",r:null},{w:"کرد",r:"فعل"}]},
  {s:[{w:"ما",r:"نهاد"},{w:"با",r:"حرف اضافه"},{w:"ماشین",r:"متمم"},{w:"به",r:"حرف اضافه"},{w:"شمال",r:"متمم"},{w:"رفتیم",r:"فعل"}]},
  {s:[{w:"بچه",r:"نهاد"},{w:"از",r:"حرف اضافه"},{w:"مدرسه",r:"متمم"},{w:"برگشت",r:"فعل"}]},
  {s:[{w:"او",r:"نهاد"},{w:"در",r:"حرف اضافه"},{w:"کتابخانه",r:"متمم"},{w:"درس",r:null},{w:"خواند",r:"فعل"}]},
  {s:[{w:"معلم",r:"نهاد"},{w:"به",r:"حرف اضافه"},{w:"دانش‌آموز",r:"متمم"},{w:"کمک",r:null},{w:"کرد",r:"فعل"}]},
  {s:[{w:"او",r:"نهاد"},{w:"از",r:"حرف اضافه"},{w:"دوستش",r:"متمم"},{w:"تشکر",r:"مفعول"},{w:"کرد",r:"فعل"}]},
  {s:[{w:"من",r:"نهاد"},{w:"به",r:"حرف اضافه"},{w:"پدرم",r:"متمم"},{w:"گفتم",r:"فعل"}]},
  {s:[{w:"او",r:"نهاد"},{w:"با",r:"حرف اضافه"},{w:"دقت",r:"متمم"},{w:"گوش",r:null},{w:"داد",r:"فعل"}]},
  {s:[{w:"بچه",r:"نهاد"},{w:"از",r:"حرف اضافه"},{w:"خواب",r:"متمم"},{w:"بیدار",r:"مسند"},{w:"شد",r:"فعل"}]},
  {s:[{w:"ما",r:"نهاد"},{w:"در",r:"حرف اضافه"},{w:"حیاط",r:"متمم"},{w:"نشستیم",r:"فعل"}]},
  {s:[{w:"او",r:"نهاد"},{w:"به",r:"حرف اضافه"},{w:"مهمانی",r:"متمم"},{w:"رفت",r:"فعل"}]},
  {s:[{w:"من",r:"نهاد"},{w:"دیشب",r:"قید"},{w:"خواب",r:"مفعول"},{w:"دیدم",r:"فعل"}]},
  {s:[{w:"پدر",r:"نهاد"},{w:"در",r:"حرف اضافه"},{w:"اتاق",r:"متمم"},{w:"استراحت",r:null},{w:"کرد",r:"فعل"}]},
  {s:[{w:"او",r:"نهاد"},{w:"برای",r:"حرف اضافه"},{w:"ما",r:"متمم"},{w:"شعر",r:"مفعول"},{w:"خواند",r:"فعل"}]},
  {s:[{w:"مادر",r:"نهاد"},{w:"با",r:"حرف اضافه"},{w:"مهربانی",r:"متمم"},{w:"ما",r:"مفعول"},{w:"بوسید",r:"فعل"}]},
  {s:[{w:"من",r:"نهاد"},{w:"فردا",r:"قید"},{w:"با",r:"حرف اضافه"},{w:"دوستم",r:"متمم"},{w:"ملاقات",r:null},{w:"می‌کنم",r:"فعل"}]},
  {s:[{w:"او",r:"نهاد"},{w:"همیشه",r:"قید"},{w:"به",r:"حرف اضافه"},{w:"فقرا",r:"متمم"},{w:"کمک",r:null},{w:"می‌کند",r:"فعل"}]},
  {s:[{w:"ما",r:"نهاد"},{w:"با",r:"حرف اضافه"},{w:"هم",r:"متمم"},{w:"همکاری",r:"مفعول"},{w:"کردیم",r:"فعل"}]},
  {s:[{w:"من",r:"نهاد"},{w:"از",r:"حرف اضافه"},{w:"این",r:"متمم"},{w:"کتاب",r:"مفعول"},{w:"خوشم",r:"فعل"}]}
];

/* ==================== تنظیمات ==================== */
const ROLES = ["نهاد","مفعول","متمم","مسند","فعل","قید","منادا","حرف اضافه"];
const FA_DIGITS = ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];

let usedIndices = [];
let currentSentences = [];
let assignments = [];
let round = 1;
let statCorrect = 0, statWrong = 0;
let activeWordEl = null, activeSentIdx = -1, activeWordIdx = -1;

function perRoundCount(r){ return r === 1 ? 2 : r === 2 ? 3 : r === 3 ? 4 : 5; }

/* ==================== کش المنت‌ها ==================== */
const $ = id => document.getElementById(id);
const startScreen=$("startScreen"), gameScreen=$("gameScreen"), roundEndScreen=$("roundEndScreen");
const sentencesEl=$("sentences"), checkBtn=$("checkBtn"), resetBtn=$("resetBtn");
const overlay=$("overlay"), sheet=$("sheet"), rolesGrid=$("rolesGrid"), selectedWordEl=$("selectedWord");
const progressPill=$("progressPill");
const roundNumEl = $("roundNum"), perRoundLbl = $("perRoundLbl");
const toast=$("toast"), toastNum=$("toastNum"), toastOk=$("toastOk");
const confirmBox=$("confirm"), confirmYes=$("confirmYes"), confirmNo=$("confirmNo");
const statCorrectEl = $("statCorrect"), statWrongEl = $("statWrong"), statRoundEl = $("statRound");
const endEmojiEl=$("endEmoji"), endTitleEl=$("endTitle"), endTextEl=$("endText"), nextBtn=$("nextBtn");

/* ==================== توابع کمکی ==================== */
function toFa(n){
  return String(n).replace(/\d/g, d => FA_DIGITS[+d]);
}

function showErrorToast(count){
  toastNum.textContent = toFa(count);
  toast.classList.add("on");
}
toastOk.addEventListener("click", ()=> toast.classList.remove("on"));

/* ==================== ریپل — فقط روی دکمه‌ها، ساده‌شده ==================== */
function addRipple(e){
  const btn = e.currentTarget;
  const c = document.createElement("span");
  const d = Math.max(btn.clientWidth, btn.clientHeight);
  const r = btn.getBoundingClientRect();
  c.style.cssText = `position:absolute;border-radius:50%;background:rgba(255,255,255,.5);pointer-events:none;width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px;transform:scale(0);animation:ripple .5s linear;`;
  btn.appendChild(c);
  setTimeout(()=> c.remove(), 550);
}
const rippleStyle = document.createElement("style");
rippleStyle.textContent = "@keyframes ripple{to{transform:scale(4);opacity:0;}}";
document.head.appendChild(rippleStyle);

document.querySelectorAll(".btn").forEach(b=> b.addEventListener("click", addRipple));

/* ==================== شیت نقش‌ها ==================== */
function buildRoleSheet(){
  const frag = document.createDocumentFragment();
  ROLES.forEach(role=>{
    const b = document.createElement("button");
    b.className = "role-btn";
    b.textContent = role;
    b.dataset.role = role;
    b.addEventListener("click", ()=> pickRole(role));
    frag.appendChild(b);
  });
  const clear = document.createElement("button");
  clear.className = "role-btn clear-role";
  clear.textContent = "پاک کردن نقش";
  clear.addEventListener("click", ()=> pickRole(null));
  frag.appendChild(clear);
  rolesGrid.appendChild(frag);
}
buildRoleSheet();

function openSheet(wordEl, si, wi){
  activeWordEl = wordEl;
  activeSentIdx = si;
  activeWordIdx = wi;
  selectedWordEl.textContent = wordEl.dataset.word;
  const cur = assignments[si][wi];
  const children = rolesGrid.children;
  for(let i=0; i<children.length; i++){
    children[i].classList.toggle("active", children[i].dataset.role === cur);
  }
  overlay.classList.add("on");
  sheet.classList.add("on");
}
function closeSheet(){
  overlay.classList.remove("on");
  sheet.classList.remove("on");
}
overlay.addEventListener("click", closeSheet);

function pickRole(role){
  if(activeSentIdx < 0) return;
  assignments[activeSentIdx][activeWordIdx] = role;
  const el = activeWordEl;
  if(role){
    el.classList.add("assigned");
    el.dataset.label = role;
  } else {
    el.classList.remove("assigned");
    el.removeAttribute("data-label");
  }
  el.classList.remove("wrong", "correct");
  updateCheckBtn();
  closeSheet();
}

/* ==================== رندر جملات — با DocumentFragment ==================== */
function renderSentences(){
  const frag = document.createDocumentFragment();
  currentSentences.forEach((sent, si)=>{
    const row = document.createElement("div");
    row.className = "sentence";
    row.style.animationDelay = (si * 0.05) + "s";
    sent.s.forEach((tok, wi)=>{
      const w = document.createElement("span");
      w.className = "word";
      w.textContent = tok.w;
      w.dataset.word = tok.w;
      w.dataset.si = si;
      w.dataset.wi = wi;
      row.appendChild(w);
    });
    frag.appendChild(row);
  });
  sentencesEl.replaceChildren(frag);
}

/* ==================== انتخاب جملات بدون تکرار ==================== */
function pickSentences(count){
  let available = [];
  for(let i = 0; i < BANK.length; i++){
    if(!usedIndices.includes(i)) available.push(i);
  }
  if(available.length < count){
    usedIndices = [];
    available = [];
    for(let i = 0; i < BANK.length; i++) available.push(i);
  }
  const chosen = [];
  while(chosen.length < count){
    const idx = available[Math.floor(Math.random() * available.length)];
    if(!chosen.includes(idx)) chosen.push(idx);
  }
  for(let i = 0; i < chosen.length; i++) usedIndices.push(chosen[i]);
  return chosen.map(i => BANK[i]);
}

/* ==================== شروع مرحله ==================== */
function startRound(){
  const count = perRoundCount(round);
  currentSentences = pickSentences(count);
  assignments = currentSentences.map(s => s.s.map(()=> null));
  roundNumEl.textContent = toFa(round);
  perRoundLbl.textContent = toFa(count) + " جمله";
  gameScreen.classList.remove("hidden");
  startScreen.classList.add("hidden");
  roundEndScreen.classList.add("hidden");
  progressPill.classList.remove("hidden-pill");
  renderSentences();
  updateCheckBtn();
  checkBtn.textContent = "تایید ✓";
}

/* ==================== بررسی دکمه ==================== */
function updateCheckBtn(){
  let allAssigned = true;
  outer: for(let si=0; si<currentSentences.length; si++){
    const sent = currentSentences[si].s;
    for(let wi=0; wi<sent.length; wi++){
      if(sent[wi].r !== null && assignments[si][wi] === null){
        allAssigned = false;
        break outer;
      }
    }
  }
  checkBtn.disabled = !allAssigned;
}

/* ==================== تایید ==================== */
checkBtn.addEventListener("click", ()=>{
  let wrongCount = 0;
  const wordEls = sentencesEl.querySelectorAll(".word");
  const len = wordEls.length;
  for(let i=0; i<len; i++){
    const el = wordEls[i];
    const si = +el.dataset.si;
    const wi = +el.dataset.wi;
    const correct = currentSentences[si].s[wi].r;
    const user = assignments[si][wi];
    el.classList.remove("wrong", "correct", "locked");
    if(correct === null){
      if(user !== null){ el.classList.add("wrong"); wrongCount++; }
      else el.classList.add("correct", "locked");
    } else {
      if(user === correct) el.classList.add("correct", "locked");
      else { el.classList.add("wrong"); wrongCount++; }
    }
  }

  let totalAssigned = 0;
  for(let si=0; si<currentSentences.length; si++){
    const sent = currentSentences[si].s;
    for(let wi=0; wi<sent.length; wi++){
      if(sent[wi].r !== null) totalAssigned++;
    }
  }
  statCorrect += (totalAssigned - wrongCount);
  statWrong += wrongCount;

  if(wrongCount === 0){
    fireConfetti();
    setTimeout(()=> showRoundEnd(true), 800);
  } else {
    showErrorToast(wrongCount);
    checkBtn.textContent = "بررسی مجدد ✓";
  }
});

/* ==================== پایان مرحله ==================== */
function showRoundEnd(success){
  gameScreen.classList.add("hidden");
  roundEndScreen.classList.remove("hidden");
  progressPill.classList.add("hidden-pill");
  statCorrectEl.textContent = toFa(statCorrect);
  statWrongEl.textContent = toFa(statWrong);
  statRoundEl.textContent = toFa(round);
  if(success){
    endEmojiEl.textContent = "🎉";
    endTitleEl.textContent = "آفرین! مرحله " + toFa(round) + " کامل شد";
    endTextEl.textContent = "همه نقش‌ها را درست تشخیص دادی. آماده‌ای برای مرحله بعد؟";
    nextBtn.textContent = "مرحله بعد ➜";
  }
}

nextBtn.addEventListener("click", ()=>{
  round++;
  statCorrect = 0;
  statWrong = 0;
  startRound();
});
$("startBtn").addEventListener("click", ()=>{
  round = 1;
  statCorrect = 0;
  statWrong = 0;
  startRound();
});

/* ==================== کانفتی سبک ==================== */
const CONFETTI_COLORS = ["#4285f4", "#ea4335", "#fbbc05", "#34a853", "#a142f4"];
function fireConfetti(){
  const frag = document.createDocumentFragment();
  const items = [];
  for(let i=0; i<25; i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    c.style.animation = `fall ${1.5 + Math.random() * 1.2}s cubic-bezier(.2,.6,.4,1) forwards`;
    c.style.animationDelay = (Math.random() * 0.3) + "s";
    if(Math.random() > 0.6) c.style.borderRadius = "50%";
    frag.appendChild(c);
    items.push(c);
  }
  document.body.appendChild(frag);
  setTimeout(()=> items.forEach(c=> c.remove()), 3200);
}

/* ==================== تأیید پاک کردن ==================== */
resetBtn.addEventListener("click", ()=> confirmBox.classList.add("on"));
confirmNo.addEventListener("click", ()=> confirmBox.classList.remove("on"));
confirmYes.addEventListener("click", ()=>{
  assignments = currentSentences.map(s => s.s.map(()=> null));
  checkBtn.textContent = "تایید ✓";
  renderSentences();
  updateCheckBtn();
  confirmBox.classList.remove("on");
});

/* ==================== جلوگیری از کپی ==================== */
document.addEventListener("copy", e => e.preventDefault());
document.addEventListener("cut", e => e.preventDefault());
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("selectstart", e =>{
  if(e.target.closest(".word") || e.target.closest("button")) return;
  e.preventDefault();
});
document.addEventListener("keydown", e=>{
  if((e.ctrlKey || e.metaKey) && ["c","x","a","u","s"].includes(e.key.toLowerCase())) e.preventDefault();
  if(e.key === "Escape") closeSheet();
});
</script>
